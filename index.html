<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Loco</title>
<style>html,body{margin:0;min-height:100vh;background:#0d1017;color:#e8ecf5;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px;box-sizing:border-box}a{color:#4cc9f0}</style></head>
<body><main><div><p id="s">Taking you to Loco…</p><p><a id="a" href="https://fabrique-futur.github.io/">Open Loco</a></p></div></main>
<script>
// Loco moved from this path to the site root. Carry the link's parameters
// across so a link handed out before the move still opens the right trip.
(function () {
  var q = new URLSearchParams(location.search);
  var to = new URL("https://fabrique-futur.github.io/");
  q.forEach(function (v, k) { to.searchParams.set(k, v); });
  document.getElementById("a").href = to.toString();
  location.replace(to.toString());
})();
</script></body></html>
